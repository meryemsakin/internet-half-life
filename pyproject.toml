[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-half-life"
version = "0.2.0"
description = "An atlas of how Wikipedia attention spreads, fades, and returns."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Meryem Sakin" }]
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
]

[project.optional-dependencies]
timesfm = ["timesfm[torch]>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
internet-half-life = "internet_half_life.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
